# Render Blueprint: deploys the assistant API (backend/) from this repo.
# Dashboard: New > Blueprint > pick this repo. Secrets are set in the dashboard, never here.
services:
  - type: web
    name: qenbel-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_API_KEY
        sync: false          # paste in the Render dashboard
      - key: HISTORY_SECRET
        generateValue: true  # signs assistant replies so visitors cannot forge chat history
      - key: TRUST_PROXY
        value: 1             # verify once after deploying, see backend/src/config.js
      - key: GEMINI_MODELS
        value: gemini-3.5-flash,gemini-3.8-flash,gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: https://qenbel.site,https://www.qenbel.site
      - key: TEAM_EMAIL
        value: admin.qenbel@gmail.com
